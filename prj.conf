# Button and LED library
CONFIG_DK_LIBRARY=y

# Bluetooth LE
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="npm2100_nrf54l15_BFG"
CONFIG_BT_MAX_CONN=1
# CONFIG_BT_BUF_ACL_TX_COUNT=10 

CONFIG_BT_NSMS=y
CONFIG_BT_BAS=y

# add DLE for the rd all characteristic data to not be fragmented
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_CTLR_PHY_CODED=y
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_CTLR_DATA_LENGTH_MAX=124
CONFIG_BT_BUF_ACL_TX_SIZE=124
CONFIG_BT_BUF_ACL_RX_SIZE=124
CONFIG_BT_L2CAP_TX_MTU=120

# Increase stack size for the main thread and System Workqueue
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_MAIN_STACK_SIZE=2048

# !DBG 
#I2C
CONFIG_I2C=y
CONFIG_CBPRINTF_FP_SUPPORT=y


# Power savings if you disable these.
CONFIG_LOG=y
CONFIG_SERIAL=y
CONFIG_LOG_MODE_DEFERRED=y
#CONFIG_LOG_DEFAULT_LEVEL=0

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=4096

# Event manager
# CONFIG_APP_EVENT_MANAGER=y
# CONFIG_APP_EVENT_MANAGER_LOG_LEVEL_OFF=y
# CONFIG_CAF=y
# CONFIG_CAF_LEDS=y
# CONFIG_CAF_LEDS_PWM=y

# tx power config examples. not all socs support all +/-, check your soc
# CONFIG_BT_CTRL_TX_PWR_PLUS_8=y
# CONFIG_BT_CTLR_TX_PWR_0=y
# CONFIG_BT_CTLR_TX_PWR_MINUS_40=y

CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y

# from FG
# CONFIG_SHELL=y
# CONFIG_LOG=y
# CONFIG_LOG_CMDS=y
# CONFIG_I2C_SHELL=y

# !DBG NOT AA anymore. testing if i want it here or in app.
# instead of using shell to pick model, we default to AA.
# CONFIG_BATTERY_MODEL_ALKALINE_AA=y

CONFIG_GPIO=y
CONFIG_REGULATOR=y
CONFIG_SENSOR=y
CONFIG_NRF_FUEL_GAUGE=y
CONFIG_NRF_FUEL_GAUGE_VARIANT_PRIMARY_CELL=y
CONFIG_REQUIRES_FLOAT_PRINTF=y


# Add ADC support
CONFIG_ADC=y